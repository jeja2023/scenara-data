# Data 独立管理模式：
# - Data 仍使用共享 PostgreSQL、Redis、MinIO 和 scenara-platform 网络；
# - 不依赖 Core 的身份上下文和事件端点；
# - 使用 Data 自己的本地登录和内置 Web 工作台；
# - 该模式适合独立数据治理/训练准备，不负责 Core 模型发布治理。
services:
  data-migrate:
    image: ${SCENARA_DATA_IMAGE:?必须设置 SCENARA_DATA_IMAGE}
    command: ["python", "scripts/migrate.py"]
    environment: &runtime-environment
      SCENARA_DATA_DEPLOYMENT_PROFILE: standalone
      SCENARA_DATA_RUNTIME_MODE: postgres
      SCENARA_DATA_DATABASE_URL_FILE: /run/secrets/data_database_url
      SCENARA_DATA_REDIS_URL: ${SCENARA_DATA_REDIS_URL:?必须设置 TLS Redis 地址}
      SCENARA_DATA_S3_ENDPOINT_URL: ${SCENARA_DATA_S3_ENDPOINT_URL:?必须设置 HTTPS S3 地址}
      SCENARA_DATA_S3_REGION: ${SCENARA_DATA_S3_REGION:?必须设置 S3 区域}
      SCENARA_DATA_S3_ACCESS_KEY_ID_FILE: /run/secrets/data_s3_access_key_id
      SCENARA_DATA_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/data_s3_secret_access_key
      SCENARA_DATA_TRUSTED_SERVICE_TOKEN_FILE: /run/secrets/data_service_token
      SCENARA_DATA_TRUSTED_SERVICE_TOKENS_FILE: /run/secrets/data_service_tokens
      SCENARA_DATA_REQUEST_CONTEXT_SIGNING_KEY_FILE: /run/secrets/data_context_signing_key
      SCENARA_DATA_CONSOLE_LOGIN_ENABLED: "true"
      SCENARA_DATA_CONSOLE_PASSWORD_FILE: /run/secrets/data_console_password
      SCENARA_DATA_SERVE_FRONTEND: "true"
      SCENARA_DATA_FRONTEND_DIST: /app/frontend-dist
      SCENARA_DATA_CORS_ALLOW_ORIGINS: ${SCENARA_DATA_CORS_ALLOW_ORIGINS:?必须设置 HTTPS Data 页面来源}
      SSL_CERT_FILE: ${SCENARA_PLATFORM_CA_FILE:-/run/tls/ca.crt}
      REQUESTS_CA_BUNDLE: ${SCENARA_PLATFORM_CA_FILE:-/run/tls/ca.crt}
      AWS_CA_BUNDLE: ${SCENARA_PLATFORM_CA_FILE:-/run/tls/ca.crt}
      PGSSLROOTCERT: ${SCENARA_PLATFORM_CA_FILE:-/run/tls/ca.crt}
    secrets: &runtime-secrets
      - data_database_url
      - data_s3_access_key_id
      - data_s3_secret_access_key
      - data_service_token
      - data_service_tokens
      - data_context_signing_key
      - data_console_password
    networks: [platform]
    volumes:
      - ${SCENARA_PLATFORM_CERTS_DIR:?set SCENARA_PLATFORM_CERTS_DIR}/ca/ca.crt:/run/tls/ca.crt:ro
      - ${SCENARA_PLATFORM_CERTS_DIR:?set SCENARA_PLATFORM_CERTS_DIR}/data/server.crt:/run/tls/server.crt:ro
      - ${SCENARA_PLATFORM_CERTS_DIR:?set SCENARA_PLATFORM_CERTS_DIR}/data/server.key:/run/tls/server.key:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    restart: "no"

  data-api:
    image: ${SCENARA_DATA_IMAGE:?必须设置 SCENARA_DATA_IMAGE}
    command:
      ["uvicorn", "scenara_data.api.app:app", "--host", "0.0.0.0", "--port", "8081", "--timeout-graceful-shutdown", "30", "--ssl-keyfile", "/run/tls/server.key", "--ssl-certfile", "/run/tls/server.crt", "--ssl-ca-certs", "/run/tls/ca.crt"]
    environment: *runtime-environment
    secrets: *runtime-secrets
    networks:
      platform:
        aliases: [data.scenara.internal]
    ports:
      - "127.0.0.1:${SCENARA_DATA_HTTP_PORT:-8081}:8081"
    volumes:
      - ${SCENARA_PLATFORM_CERTS_DIR:?set SCENARA_PLATFORM_CERTS_DIR}/ca/ca.crt:/run/tls/ca.crt:ro
      - ${SCENARA_PLATFORM_CERTS_DIR:?set SCENARA_PLATFORM_CERTS_DIR}/data/server.crt:/run/tls/server.crt:ro
      - ${SCENARA_PLATFORM_CERTS_DIR:?set SCENARA_PLATFORM_CERTS_DIR}/data/server.key:/run/tls/server.key:ro
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    init: true
    restart: unless-stopped
    depends_on:
      data-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; c=ssl.create_default_context(cafile='/run/tls/ca.crt'); urllib.request.urlopen('https://127.0.0.1:8081/readyz', context=c, timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

secrets:
  data_database_url:
    external: true
  data_s3_access_key_id:
    external: true
  data_s3_secret_access_key:
    external: true
  data_service_token:
    external: true
  data_service_tokens:
    external: true
  data_context_signing_key:
    external: true
  data_console_password:
    external: true

networks:
  platform:
    external: true
    name: ${SCENARA_PLATFORM_NETWORK:?必须设置受控平台网络名称}
