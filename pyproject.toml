[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scenara-data"
version = "0.1.5"
description = "景枢数据资产、数据集、标注、质量与血缘领域服务。"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.10",
  "PyYAML>=6",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.35"]
redis = ["redis>=5.2"]
http = ["httpx>=0.28"]
dev = [
  "cryptography>=43",
  "httpx>=0.28",
  "jsonschema>=4.25",
  "pillow>=10",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: 需要真实 PostgreSQL、Redis 或 S3-compatible 依赖的测试",
  "e2e: 跨仓库端到端场景测试",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]
